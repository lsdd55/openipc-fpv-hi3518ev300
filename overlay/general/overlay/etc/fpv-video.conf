# /etc/fpv-video.conf —— 空中端视频剖面
#
# 由 /usr/bin/wifibroadcast 在首次启动时读取并写入 majestic 配置。
# 只在 /etc/system.ok 不存在时生效一次。
# 想改完马上生效：
#     rm -f /etc/system.ok && killall -1 majestic && wifibroadcast start
# 或者直接改 majestic 运行时配置：
#     cli -s .video0.size 1280x720

# ---------------------------------------------------------------------------
# 关于 F23 传感器的硬限制（重要）
#
# /usr/lib/sensors/libsns_f23.so 里只有两个模式入口：
#     soi_sensor_linear_1080p30_init
#     soi_sensor_2wdr1_1080p30_init
# 且带有 "Not support Fps" / "Not support! Width:%d, Height:%d, Fps:%f"
# 的拒绝分支。也就是说 F23 物理上只输出 1080p30，没有任何 60fps 模式。
#
# 因此下面默认给 1080p30 H.264 10Mbps —— 保留你指定的编码与码率，
# 只把帧率降到传感器能给的 30。
#
# 如果你确实需要 60fps，换传感器是唯一途径。同一颗 Hi3518EV300 上：
#     IMX307 -> /etc/sensors/high-fps/imx307_1280x720_60fps.ini   (720p60)
#     IMX335 -> /etc/sensors/high-fps/imx335_1920x1080_55fps.ini  (1080p55)
# 换装后把 SENSOR_INI 指到对应文件即可。
# ---------------------------------------------------------------------------

# 分辨率。可填 1920x1080 / 1280x720（720p 是 ISP 缩放，帧率不变）
VIDEO_SIZE=1920x1080

# 帧率。F23 上限 30
VIDEO_FPS=30

# 编码。h264 兼容性最好；h265 同画质码率低约 40%，但老 goggles 可能解不了
VIDEO_CODEC=h264

# 码率 kbps。10Mbps 在 20MHz/MCS1（理论 ~13Mbps 有效）下偏满，
# 如果图传出现花屏/卡顿，先降到 6000
VIDEO_BITRATE=10000

# 码率控制：cbr 恒定码率，链路最可预测
VIDEO_RCMODE=cbr

# 传感器模式文件（hi3516ev200 家族的真实命名）
SENSOR_INI=/etc/sensors/jxf23_i2c_1080p.ini

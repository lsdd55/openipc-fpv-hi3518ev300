# /etc/apfpv-video.conf —— AP 推流模式的视频剖面
#
# 由 /usr/bin/apfpv 在**首次启动**时读一次，写进 majestic 配置
# （之后用 /etc/system.ok 做标记，不再覆盖你手改过的值）。
#
# 想改完立刻生效：
#     rm -f /etc/system.ok && /etc/init.d/S50apfpv restart
# 或者直接改运行时配置：
#     cli -s .video0.size 1280x720
#
# 格式与 FPV 那份 /etc/fpv-video.conf 一致，只认下面这 6 个键。

# 分辨率。1920x1080 / 1280x720（720p 是 ISP 缩放，帧率不变）
VIDEO_SIZE=1920x1080

# 帧率。F23 硬件上限 30 —— libsns_f23.so 只有 linear_1080p30 与
# 2wdr1_1080p30 两个模式入口，没有 60fps
VIDEO_FPS=30

# 编码。h264 兼容性最好（老眼镜/手机都解得了）
VIDEO_CODEC=h264

# 码率 kbps。纯 AP 直连不比远距链路，可以给足
VIDEO_BITRATE=8000

# 码率控制
VIDEO_RCMODE=cbr

# 传感器模式文件（hi3516ev200 家族的真实命名，注意前缀是 jxf23）
SENSOR_INI=/etc/sensors/jxf23_i2c_1080p.ini

# /etc/apfpv.conf —— AP 推流模式的配置
#
# 由 /usr/bin/apfpv 读取，改完执行：
#     apfpv restart
# 即生效，不需要重新刷机。语法是 KEY=VALUE，一行一个，
# 只认下面这几个键，其它键会被忽略。

# 热点名字（客户端搜到的 SSID）
SSID=OpenIPC-AP

# WPA2 密码：8–63 位。
# 留空 = 开放网络（谁都能连，近距离测试可以，正式飞建议设密码）
PASSWORD=openipc12345

# ---------------------------------------------------------------- 信道
#
# 5GHz（与 FPV 链路同频段，抗干扰好、手机大多支持）：
#     CHANNEL=161  HW_MODE=a
# 2.4GHz（老手机/老眼镜兼容性最好，但干扰多）：
#     CHANNEL=6    HW_MODE=g
#
# 两者要匹配，apfpv 会按 CHANNEL 自动纠正 HW_MODE 并在日志里说明。
CHANNEL=161
HW_MODE=a
WIDTH=20

# 本机地址。热点的地址，客户端会从它的 DHCP 池拿地址。
# 池子按最后一段推出来：AP_IP=192.168.4.1 → 192.168.4.10–192.168.4.100
AP_IP=192.168.4.1
AP_MASK=255.255.255.0
